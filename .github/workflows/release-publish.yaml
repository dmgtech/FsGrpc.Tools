name: dotnet package

on:
  push:
    tags: [v*.*]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./FsGrpc.Tools
    steps:
      - name: Checkout
        uses: actions/checkout@v2
      - name: Setup .NET Core SDK 8.0
        uses: actions/setup-dotnet@v2.0.0
        with:
          dotnet-version: 8.0.x
      - name: Authenticate to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          dotnet nuget add source "https://nuget.pkg.github.com/dmgtech/index.json" \
            --name github \
            --username "${{ github.actor }}" \
            --password "$GITHUB_TOKEN" \
            --store-password-in-clear-text
      - name: Display version
        run: dotnet --version
      - name: Install dependencies (restore via GitHub feed)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NUGET_AUTH_TOKEN: ${{ github.token }}
        run: dotnet restore --source https://nuget.pkg.github.com/dmgtech/index.json --source https://api.nuget.org/v3/index.json
      - name: Build
        run: dotnet build --configuration Release --no-restore
      - name: List build outputs
        run: |
          echo "Workspace directory:" && pwd
          echo "Project directory contents:" && ls -la
          echo "bin contents:" && ls -la bin || true
          echo "bin/Release contents:" && ls -la bin/Release || true
          echo "bin/Release/netstandard2.0 contents:" && ls -la bin/Release/netstandard2.0 || true
          echo "Find task artifacts:" && find bin -maxdepth 3 -type f -name 'Protobuf.MSBuild*' -print || true
      - name: Show evaluated pack Include items
        run: |
          echo "Evaluating None Include items for pack..."
          dotnet msbuild FsGrpc.Tools.csproj -t:Pack -p:Configuration=Release -p:SkipPack=true -v:m -nologo -bl:msbuild.binlog || true
          echo "Dump glob of csproj for Include paths:" && grep -n "None Include=\"\$(OutputPath)\$(TargetFramework)\\\$(AssemblyName)\"" -n FsGrpc.Tools.csproj || true
      - name: Verify artifacts exist
        run: |
          test -f bin/Release/netstandard2.0/Protobuf.MSBuild.dll || (echo "Missing netstandard2.0 Protobuf.MSBuild.dll" && exit 1)
      - name: Package
        env:
          FSGRPCTOOLS_VERSION: ${{github.ref_name}}
        run: dotnet pack -p:FSGRPCTOOLS_VERSION=${FSGRPCTOOLS_VERSION#v} --no-restore --configuration Release
      - name: Nuget Push (GitHub Packages)
        env:
          FSGRPCTOOLS_VERSION: ${{github.ref_name}}
          GITHUB_TOKEN: ${{ github.token }}
        run: dotnet nuget push bin/Release/FsGrpc.Tools.${FSGRPCTOOLS_VERSION#v}.nupkg --api-key "$GITHUB_TOKEN" --source https://nuget.pkg.github.com/dmgtech/index.json --skip-duplicate
      - name: GitHubRelease
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ./FsGrpc.Tools/bin/Release/FsGrpc.Tools.$($env:GITHUB_REF -replace "refs/tags/").nupkg

